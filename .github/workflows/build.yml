name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # mount these so we can delete them for more disk space
      options: >-
        -v /usr/share/dotnet:/host/dotnet
        -v /usr/local/lib/android:/host/android
        -v /opt/ghc:/host/ghc
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free Disk Space
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/toolcache/*
          df -h /

      - name: Prepare System
        run: |
          pacman -Syu --noconfirm git github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          echo 'MAKEFLAGS="-j$(nproc)"' >> /etc/makepkg.conf

      - name: Clone Repo
        uses: actions/checkout@v7

      - name: Build Packages
        run: |
          chown -R builder .
          mkdir -p out

          for dir in */; do
            [ -f "$dir/PKGBUILD" ] || continue
            (cd "$dir" && sudo -u builder makepkg -s -r -c --noconfirm)

            mv "$dir"/*.pkg.tar.zst out/
            repo-add out/archpackages.db.tar.zst out/*.pkg.tar.zst

            grep -q '^\[archpackages\]' /etc/pacman.conf || printf '\n[archpackages]\nSigLevel = Optional TrustAll\nServer = file://%s/out\n' "$PWD" >> /etc/pacman.conf
            pacman -Sy --noconfirm
            
            rm -f /var/cache/pacman/pkg/*
          done

      - name: Create Repo Database
        run: |
          cd out
          rm archpackages.db archpackages.files
          cp archpackages.db.tar.zst archpackages.db
          cp archpackages.files.tar.zst archpackages.files

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete repo --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create repo out/* --title "Package Repo" --notes "Built from ${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"