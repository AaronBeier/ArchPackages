name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ffmpeg-custom
          - package: cactus-bin
          - package: llama.cpp-gfx906
            free-disk: true
            
    uses: ./.github/workflows/makepkg.yml
    with:
      package: ${{ matrix.package }}
      free-disk: ${{ matrix.free-disk || false }}

  aocl-blis-zen5:
    uses: ./.github/workflows/makepkg.yml
    with:
      package: aocl-blis-zen5

  llama-cpp-zen5:
    needs: aocl-blis-zen5
    uses: ./.github/workflows/makepkg.yml
    with:
      package: llama.cpp-zen5
      deps: aocl-blis-zen5

  publish:
    needs: [build, aocl-blis-zen5, llama-cpp-zen5]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Prepare System
        run: pacman -Syu --noconfirm github-cli

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true

      - name: Create Repo Database
        run: |
          cd out
          repo-add archpackages.db.tar.zst *.pkg.tar.zst
          rm archpackages.db archpackages.files
          cp archpackages.db.tar.zst archpackages.db
          cp archpackages.files.tar.zst archpackages.files

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete repo --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create repo out/* --target "$GITHUB_SHA" --title "Package Repo" --notes "Built from ${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"
